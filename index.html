<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="grid grid-cols-[1.5fr_1fr] grid-rows-[70px]">
        <div class="mt-[30px] ml-[50px] flex gap-[50px]">
            <img class="w-[150px]" src="./UI.desk.png" alt="">
            <p class="text-[20px] text-[#5FB848] ml-[150px]">Home</p>
            <p class="text-[20px]">About</p>
            <p class="text-[20px]">Contact</p>
            <p class="text-[20px]">Testimonials</p>
        </div>
        <div class="mt-[30px] flex gap-[15px]">
            <img class="w-[25px] h-[25px] ml-[300px]" src="./SEARCH (3).png" alt="">
            <img class="w-[25px] h-[25px]" src="./Cart Icon.png" alt="">
            <button class="text-[20px] border-[1px] border-solid px-[20px] py-[5px] ml-[20px] rounded-[10px] bg-[#181D19] text-[white] mt-[-7px]">Order Now</button>
        </div>
    </div>
    <div class="grid grid-cols-[1fr_1fr] grid-rows-[600px]">
        <div class="mt-[100px] ml-[90px]">
            <h1 class="text-[60px] w-[500px]">Just <span class="text-[#64BB47]">Eat healthy</span>  Food to live a Healthier life</h1>
            <p class="mt-[30px] text-[20px] w-[400px]">Enjoy a healthy life by eating healthy foods that have extraordinary flavors that make your life healthier for today and in the future</p>
            <button class="text-[20px] border-[1px] border-solid px-[35px] py-[10px] mt-[50px] rounded-[20px] bg-[#2C9553] text-[white]">Order Now</button>
        </div>
        <div>
            <img class="w-[800px] h-[800px] ml-[-100px]" src="./header Image.png" alt="">
        </div>
    </div>
    
</body>
</html>
